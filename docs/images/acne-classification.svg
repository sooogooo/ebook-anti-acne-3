<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="500" fill="#f8f9fa" rx="10"/>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">痤疮类型分类</text>
  
  <!-- 轻度痤疮 -->
  <g transform="translate(50, 60)">
    <rect width="300" height="100" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">轻度痤疮</text>
    <circle cx="40" cy="50" r="8" fill="#ffeb3b" stroke="#f57f17" stroke-width="1"/>
    <circle cx="80" cy="50" r="8" fill="#ffeb3b" stroke="#f57f17" stroke-width="1"/>
    <circle cx="120" cy="50" r="8" fill="#ffeb3b" stroke="#f57f17" stroke-width="1"/>
    <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">粉刺 + 少量丘疹</text>
    <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">局部治疗为主</text>
  </g>
  
  <!-- 中度痤疮 -->
  <g transform="translate(50, 180)">
    <rect width="300" height="100" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100">中度痤疮</text>
    <circle cx="40" cy="50" r="10" fill="#ff5722" stroke="#bf360c" stroke-width="1"/>
    <circle cx="80" cy="50" r="8" fill="#ffeb3b" stroke="#f57f17" stroke-width="1"/>
    <circle cx="120" cy="50" r="10" fill="#ff5722" stroke="#bf360c" stroke-width="1"/>
    <circle cx="160" cy="50" r="10" fill="#ff5722" stroke="#bf360c" stroke-width="1"/>
    <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">丘疹 + 脓疱</text>
    <text x="150" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">需要联合治疗</text>
  </g>
  
  <!-- 重度痤疮 -->
  <g transform="translate(50, 300)">
    <rect width="300" height="100" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c62828">重度痤疮</text>
    <circle cx="40" cy="50" r="12" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
    <circle cx="80" cy="50" r="10" fill="#ff5722" stroke="#bf360c" stroke-width="1"/>
    <circle cx="120" cy="50" r="12" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
    <circle cx="160" cy="50" r="10" fill="#ff5722" stroke="#bf360c" stroke-width="1"/>
    <circle cx="200" cy="50" r="12" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
    <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c62828">结节 + 囊肿</text>
    <text x="150" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">需要口服药物治疗</text>
  </g>
  
  <!-- 底部说明 -->
  <text x="200" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">根据皮损类型和数量确定严重程度</text>
  <text x="200" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">治疗方案需个体化制定</text>
</svg>