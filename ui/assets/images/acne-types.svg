<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#fef7f8"/>

  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#2d3748">痤疮类型分类</text>

  <!-- 轻度痤疮 -->
  <g transform="translate(50, 70)">
    <circle cx="40" cy="40" r="25" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2"/>
    <circle cx="35" cy="35" r="3" fill="#ff7675" opacity="0.6"/>
    <circle cx="45" cy="40" r="2" fill="#ff7675" opacity="0.4"/>
    <circle cx="38" cy="45" r="2.5" fill="#ff7675" opacity="0.5"/>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">轻度痤疮</text>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">少量粉刺和丘疹</text>
  </g>

  <!-- 中度痤疮 -->
  <g transform="translate(150, 70)">
    <circle cx="40" cy="40" r="25" fill="#fab1a0" stroke="#e17055" stroke-width="2"/>
    <circle cx="35" cy="35" r="4" fill="#ff7675" opacity="0.8"/>
    <circle cx="45" cy="38" r="3" fill="#ff7675" opacity="0.7"/>
    <circle cx="38" cy="45" r="3.5" fill="#ff7675" opacity="0.7"/>
    <circle cx="42" cy="42" r="2.5" fill="#ff7675" opacity="0.6"/>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">中度痤疮</text>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">较多丘疹和脓疱</text>
  </g>

  <!-- 重度痤疮 -->
  <g transform="translate(250, 70)">
    <circle cx="40" cy="40" r="25" fill="#ff7675" stroke="#d63031" stroke-width="2"/>
    <circle cx="35" cy="35" r="5" fill="#d63031" opacity="0.9"/>
    <circle cx="45" cy="38" r="4" fill="#d63031" opacity="0.8"/>
    <circle cx="38" cy="45" r="4.5" fill="#d63031" opacity="0.8"/>
    <circle cx="42" cy="42" r="3.5" fill="#ff7675" opacity="0.7"/>
    <circle cx="40" cy="48" r="3" fill="#d63031" opacity="0.7"/>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">重度痤疮</text>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#718096">结节和囊肿</text>
  </g>

  <!-- 治疗建议 -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="300" height="80" rx="10" fill="#ffffff" stroke="#e8b4b8" stroke-width="1"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2d3748">治疗建议</text>

    <g transform="translate(20, 40)">
      <circle cx="5" cy="5" r="2" fill="#74b9ff"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">轻度：外用药物为主</text>
    </g>

    <g transform="translate(160, 40)">
      <circle cx="5" cy="5" r="2" fill="#55a3ff"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">中度：联合治疗</text>
    </g>

    <g transform="translate(20, 60)">
      <circle cx="5" cy="5" r="2" fill="#0984e3"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">重度：口服药物+外用</text>
    </g>

    <g transform="translate(160, 60)">
      <circle cx="5" cy="5" r="2" fill="#0984e3"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="11" fill="#2d3748">建议：专业医生指导</text>
    </g>
  </g>
</svg>